name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

env:
  SERVICE: loyalty-service
  REGION: us-east4

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - run: ./gradlew --no-daemon test

  deploy-dev:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build and push image
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          IMAGE="${REGION}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/services/${SERVICE}:${GITHUB_SHA}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
      - uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE }}
          env_vars: |
            ADMIN_AUDIENCE=${{ vars.ADMIN_AUDIENCE }}
            ADMIN_ALLOWED_EMAILS=${{ vars.ADMIN_ALLOWED_EMAILS }}
            APP_WEB_BASE_URL=${{ vars.APP_WEB_BASE_URL }}
            PUBSUB_TOPIC=${{ vars.PUBSUB_TOPIC }}
            OUTBOX_BATCH_SIZE=${{ vars.OUTBOX_BATCH_SIZE }}
            OUTBOX_MAX_ATTEMPTS=${{ vars.OUTBOX_MAX_ATTEMPTS }}
            OUTBOX_FAST_PATH_TIMEOUT_MS=${{ vars.OUTBOX_FAST_PATH_TIMEOUT_MS }}
            OUTBOX_PUBLISH_AUDIENCE=${{ vars.OUTBOX_PUBLISH_AUDIENCE }}
            OUTBOX_PUBLISH_ALLOWED_EMAILS=${{ vars.OUTBOX_PUBLISH_ALLOWED_EMAILS }}
            VERIFICATION_SENDER=${{ vars.VERIFICATION_SENDER || 'disabled' }}
            APP_ENV=${{ vars.APP_ENV }}
            WALLET_SERVICE_URL=${{ vars.WALLET_SERVICE_URL }}
            WALLET_SERVICE_AUDIENCE=${{ vars.WALLET_SERVICE_AUDIENCE }}
            WALLET_ISSUE_TIMEOUT_MS=${{ vars.WALLET_ISSUE_TIMEOUT_MS || '20000' }}
            ENROLL_PHONE_LIMIT_PER_HOUR=${{ vars.ENROLL_PHONE_LIMIT_PER_HOUR || '3' }}
            ENROLL_IP_LIMIT_PER_HOUR=${{ vars.ENROLL_IP_LIMIT_PER_HOUR || '10' }}
            ENROLL_TENANT_LIMIT_PER_HOUR=${{ vars.ENROLL_TENANT_LIMIT_PER_HOUR || '60' }}
            ENROLL_CARD_IP_LIMIT_PER_HOUR=${{ vars.ENROLL_CARD_IP_LIMIT_PER_HOUR || '30' }}
            ENROLL_CODE_TTL_MINUTES=${{ vars.ENROLL_CODE_TTL_MINUTES || '10' }}
            ENROLL_MAX_ATTEMPTS=${{ vars.ENROLL_MAX_ATTEMPTS || '5' }}
          secrets: |
            DATABASE_URL=neon-database-url:latest
            JWT_SIGNING_KEY=jwt-signing-key:latest
            OTP_HASH_SALT=otp-hmac-salt:latest
