server:
  port: ${PORT:8080}
  shutdown: graceful

spring:
  application:
    name: loyalty-service
  lifecycle:
    timeout-per-shutdown-phase: 20s
  webflux:
    multipart:
      # El único upload es el logo (máx. 2 MB, lo corta el controlador). Hasta 3 MB por parte se
      # quedan en memoria; una parte más grande se corta al pasar de 3 MB en disco (413 LOGO_TOO_LARGE).
      max-in-memory-size: 3MB
      max-disk-usage-per-part: 3MB
      max-parts: 4

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

app:
  database:
    url: ${DATABASE_URL:}
    pool-max-size: ${DB_POOL_MAX_SIZE:10}
    migrate-on-startup: ${DB_MIGRATE_ON_STARTUP:true}
  security:
    password-min-length: ${PASSWORD_MIN_LENGTH:8}
    bcrypt-strength: ${BCRYPT_STRENGTH:12}
  logos:
    bucket: ${LOGOS_BUCKET:}
    public-base-url: ${LOGOS_PUBLIC_BASE_URL:}
  admin:
    audience: ${ADMIN_AUDIENCE:}
    allowed-emails: ${ADMIN_ALLOWED_EMAILS:}
  auth:
    jwt-signing-key: ${JWT_SIGNING_KEY:}
    access-token-ttl-seconds: ${ACCESS_TOKEN_TTL_SECONDS:900}
    refresh-token-ttl-days: ${REFRESH_TOKEN_TTL_DAYS:30}
    login-max-attempts: ${LOGIN_MAX_ATTEMPTS:5}
    login-window-minutes: ${LOGIN_WINDOW_MINUTES:15}
  activation:
    web-base-url: ${APP_WEB_BASE_URL:}
    token-ttl-hours: ${ACTIVATION_TOKEN_TTL_HOURS:72}
    max-attempts-per-ip: ${ACTIVATION_MAX_ATTEMPTS_PER_IP:5}
    max-attempts-per-slug: ${ACTIVATION_MAX_ATTEMPTS_PER_SLUG:20}
    window-minutes: ${ACTIVATION_WINDOW_MINUTES:15}
  outbox:
    topic: ${PUBSUB_TOPIC:}
    batch-size: ${OUTBOX_BATCH_SIZE:50}
    max-attempts: ${OUTBOX_MAX_ATTEMPTS:8}
    fast-path-timeout-ms: ${OUTBOX_FAST_PATH_TIMEOUT_MS:1000}
    publish-timeout-ms: ${OUTBOX_PUBLISH_TIMEOUT_MS:10000}
    claim-lease-seconds: ${OUTBOX_CLAIM_LEASE_SECONDS:120}
    publish-audience: ${OUTBOX_PUBLISH_AUDIENCE:}
    publish-allowed-emails: ${OUTBOX_PUBLISH_ALLOWED_EMAILS:}
