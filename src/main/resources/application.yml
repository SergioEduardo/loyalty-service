server:
  port: ${PORT:8080}
  shutdown: graceful

spring:
  application:
    name: loyalty-service
  lifecycle:
    timeout-per-shutdown-phase: 20s

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

app:
  database:
    url: ${DATABASE_URL:}
    pool-max-size: ${DB_POOL_MAX_SIZE:10}
    migrate-on-startup: ${DB_MIGRATE_ON_STARTUP:true}
  security:
    password-min-length: ${PASSWORD_MIN_LENGTH:8}
    bcrypt-strength: ${BCRYPT_STRENGTH:12}
  admin:
    audience: ${ADMIN_AUDIENCE:}
    allowed-emails: ${ADMIN_ALLOWED_EMAILS:}
  auth:
    jwt-signing-key: ${JWT_SIGNING_KEY:}
    access-token-ttl-seconds: ${ACCESS_TOKEN_TTL_SECONDS:900}
    refresh-token-ttl-days: ${REFRESH_TOKEN_TTL_DAYS:30}
    login-max-attempts: ${LOGIN_MAX_ATTEMPTS:5}
    login-window-minutes: ${LOGIN_WINDOW_MINUTES:15}
